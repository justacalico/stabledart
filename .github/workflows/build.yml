name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all desktop targets'
        required: false
        default: 'true'
      create_release:
        description: 'Create a versioned release from this build'
        required: false
        default: 'false'
      merge_request_id:
        required: false
        default: ''
      merge_request_url:
        required: false
        default: ''

env:
  FLUTTER_VERSION: "3.47.6"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup build metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      build_all: ${{ steps.meta.outputs.build_all }}
      targets: ${{ steps.meta.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version and build metadata
        id: meta
        run: |
          VERSION=$(sed -n 's/^version: \(.*\)/\1/p' pubspec.yaml | head -1 | cut -d'+' -f1)
          BUILD_NUMBER=$(date +%s | cut -c4-10)
          if [ -n "${{ inputs.build_all }}" ]; then
            BUILD_ALL="${{ inputs.build_all }}"
          else
            BUILD_ALL="true"
          fi
          if [ "$BUILD_ALL" = "true" ]; then
            TARGETS='[{"target":"linux","os":"ubuntu-latest"},{"target":"windows","os":"windows-latest"},{"target":"macos","os":"macos-latest"}]'
          else
            TARGETS='[{"target":"linux","os":"ubuntu-latest"}]'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_all=$BUILD_ALL" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Install cocogitto and check commits
        run: |
          curl -fsSL --retry 3 -o /tmp/cog.tar.gz "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p /tmp/cog && tar -xzf /tmp/cog.tar.gz -C /tmp/cog
          sudo install -m 755 /tmp/cog/x86_64-unknown-linux-musl/cog /usr/local/bin/cog
          cog check

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze --no-pub
          xvfb-run -a flutter test --no-pub --coverage

  build:
    name: Build ${{ matrix.target }}
    needs: [setup, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build Linux desktop packages
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
          VERSION="${{ needs.setup.outputs.version }}"
          BUILD_NUMBER="${{ needs.setup.outputs.build_number }}"
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter pub get
          flutter build linux --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          BUNDLE="build/linux/x64/release/bundle"
          (cd "$BUNDLE" && zip -r "$ARTIFACTS_DIR/stabledart-linux-x86_64.zip" . >/dev/null)
          pkgdir="$GITHUB_WORKSPACE/stabledart-linux-x86_64-deb"
          mkdir -p "$pkgdir/DEBIAN" "$pkgdir/usr/lib/stabledart" "$pkgdir/usr/bin" \
            "$pkgdir/usr/share/applications" "$pkgdir/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUNDLE"/* "$pkgdir/usr/lib/stabledart/"
          cp assets/images/icon_256.png \
            "$pkgdir/usr/share/icons/hicolor/256x256/apps/stabledart.png"
          printf '#!/bin/sh\nexec /usr/lib/stabledart/stabledart "$@"\n' \
            > "$pkgdir/usr/bin/stabledart"
          chmod +x "$pkgdir/usr/bin/stabledart"
          cat > "$pkgdir/usr/share/applications/stabledart.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=StableDart
          Comment=Manage, launch and extend Stable Diffusion packages
          Exec=stabledart
          Icon=stabledart
          Type=Application
          Categories=Graphics;
          DESKTOP
          cat > "$pkgdir/DEBIAN/control" <<CONTROL
          Package: stabledart
          Version: $VERSION
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: HttpAnimations <noreply@gitlab.com>
          Description: StableDart - a Flutter port of Stability Matrix
           Manage, launch and extend Stable Diffusion packages.
          CONTROL
          dpkg-deb --build "$pkgdir" "$ARTIFACTS_DIR/stabledart-linux-x86_64.deb" >/dev/null
          bash scripts/build-rpm.sh "$BUNDLE" "$VERSION" x86_64 \
            "$ARTIFACTS_DIR/stabledart-linux-x86_64.rpm" "$BUILD_NUMBER"

      - name: Build Windows package
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.version }}"
          BUILD_NUMBER="${{ needs.setup.outputs.build_number }}"
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter pub get
          flutter build windows --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          RELEASE_DIR="build/windows/x64/runner/Release"
          (cd "$RELEASE_DIR" && 7z a -tzip "$ARTIFACTS_DIR/stabledart-windows-x86_64.zip" ./* >/dev/null)

      - name: Build macOS package
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -e
          VERSION="${{ needs.setup.outputs.version }}"
          BUILD_NUMBER="${{ needs.setup.outputs.build_number }}"
          ARTIFACTS_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          flutter pub get
          flutter build macos --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          APP="build/macos/Build/Products/Release/stabledart.app"
          hdiutil create -volname "StableDart" -srcfolder "$APP" -ov -format UDZO \
            "$ARTIFACTS_DIR/stabledart-macos-arm64.dmg"
          (cd "$(dirname "$APP")" && zip -ry "$ARTIFACTS_DIR/stabledart-macos-arm64.zip" "$(basename "$APP")" >/dev/null)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*

  release:
    name: Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !cancelled() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for d in artifacts/*/; do
            for f in "$d"*; do
              [ -f "$f" ] && cp "$f" release-assets/
            done
          done
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: StableDart ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*

      - name: Trigger GitLab sync pipeline
        env:
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          if [ -n "${GITLAB_TRIGGER_TOKEN:-}" ]; then
            curl -sf --request POST \
              --form "token=$GITLAB_TRIGGER_TOKEN" \
              --form "ref=main" \
              --form "variables[RELEASE_TAG]=$GITHUB_REF_NAME" \
              "https://gitlab.com/api/v4/projects/87470142/trigger/pipeline" > /dev/null
          else
            echo "GITLAB_TRIGGER_TOKEN not set, skipping GitLab release sync"
          fi
